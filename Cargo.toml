[package]
name = "deeplink-lab"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Vendor-neutral deep-link contract preflight, local runtime orchestration, and evidence reports"
repository = "https://github.com/Atomics-hub/deeplink-lab"
homepage = "https://github.com/Atomics-hub/deeplink-lab"
documentation = "https://github.com/Atomics-hub/deeplink-lab#readme"
license = "Apache-2.0"
readme = "README.md"
keywords = ["deeplink", "mobile", "testing", "ios", "android"]
categories = ["command-line-utilities", "development-tools::testing"]
exclude = ["work/**", "outputs/**", "proof/**", ".github/**"]

[[bin]]
name = "deeplink-lab"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6.2", features = ["derive"] }
plist = "1.8.0"
regex = "1.13.1"
roxmltree = "0.21.1"
schemars = { version = "0.8.22", features = ["chrono"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
url = { version = "2.5.7", features = ["serde"] }

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"
tempfile = "3.23.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
