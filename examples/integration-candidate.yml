apps:
  candidate-shop:
    platform: android
    appId: dev.deeplinklab.candidate
    artifact: ../fixtures/android-candidate/build/CandidateFixture.apk
    manifest: ../fixtures/android-candidate/AndroidManifest.xml
    certFingerprints:
      - 10:21:32:43:54:65:76:87:98:A9:BA:CB:DC:ED:FE:0F:10:21:32:43:54:65:76:87:98:A9:BA:CB:DC:ED:FE:0F
    launchActivity: dev.deeplinklab.candidate/dev.deeplinklab.fixture.MainActivity
    logProcess: DeepLinkFixture
    probe:
      kind: android_run_as_file
      path: files/destination.txt
associations:
