name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features --locked
      # Ignored .app/.apk build outputs are absent in a clean source checkout.
      # Allow exactly those two warnings while keeping every other finding fatal.
      - name: Validate clean-checkout preflight
        run: |
          cargo run --locked --quiet -- validate --spec deeplinklab.yml --format json \
            | tee /tmp/deeplinklab-preflight.json
          jq -e '
            .valid == true and
            .errors == 0 and
            .warnings == 2 and
            ([.issues[].code] | unique == ["app.artifact_missing"])
          ' /tmp/deeplinklab-preflight.json
      - run: scripts/check-public.sh

  msrv:
    name: Rust 1.88 minimum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo check --all-targets --all-features --locked

  supply-chain:
    name: License, advisory, and source policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check

  ios-fixture:
    name: Build iOS fixture
    runs-on: macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - run: fixtures/ios/build.sh
      - run: codesign --verify --deep --strict fixtures/ios/build/DeepLinkFixture.app
      - run: bash -n scripts/run_deeplink_lab_device_path_launch.sh
      - name: Build unsigned iPhone fixture target
        run: |
          xcodebuild \
            -project fixtures/ios/DeepLinkFixture.xcodeproj \
            -scheme DeepLinkFixture \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/deeplink-lab-device-fixture \
            CODE_SIGNING_ALLOWED=NO \
            build

  android-fixture:
    name: Build Android fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - run: fixtures/android/build.sh
      - run: "$ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose fixtures/android/build/DeepLinkFixture.apk"
      - run: fixtures/android-candidate/build.sh
      - run: "$ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose fixtures/android-candidate/build/CandidateFixture.apk"
